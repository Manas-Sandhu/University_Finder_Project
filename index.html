<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🎓 University Explorer</h1>
      <p>Discover world-class education at your fingertips</p>
    </header>

    <section class="search-section">
      <section class="search-section">
        <div class="button-group">
          <button class="btn-primary" onclick="handleSearch()">Search</button>
          <button
            class="btn-secondary"
            id="favToggle"
            onclick="toggleViewFavorites()"
          >
            View Favorites
          </button>
          <button class="btn-icon" id="themeToggle" onclick="toggleTheme()">
            🌓
          </button>
        </div>
      </section>
      <input
        type="text"
        id="searchInput"
        placeholder="Enter university name..."
      />

      <select id="countrySelect">
        <option value="">All Countries</option>
        <option value="India">India</option>
        <option value="United States">United States</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="Canada">Canada</option>
        <option value="Australia">Australia</option>
      </select>

      <select id="sortSelect" onchange="applyFiltersAndSort()">
        <option value="asc">Name (A-Z)</option>
        <option value="desc">Name (Z-A)</option>
      </select>

    </section>

    <div id="loader" class="hidden">
      <div class="spinner"></div>
      <p>Fetching Data...</p>
    </div>

    <main id="results"></main>

    <script src="script.js"></script>
  </body>
</html>
